<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adam Azwan | DevOps Bootcamp 2026</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 1.5rem;
    }

    .card {
      width: min(360px, 100%);
      padding: 2.5rem 2rem;
      text-align: center;
      border-radius: 24px;
      background: #1e293b;
      border: 1px solid #334155;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      opacity: 0;
      animation: fade-in 0.9s ease forwards;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 28px 56px rgba(0, 0, 0, 0.45);
    }

    .badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      margin-bottom: 1.4rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.6);
      animation: pulse 2.6s ease-in-out infinite;
    }

    .name {
      font-size: 1.65rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .role {
      font-size: 1rem;
      color: #67e8f9;
      margin-bottom: 0.35rem;
    }

    .cohort {
      font-size: 0.875rem;
      color: #94a3b8;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.55);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(99, 102, 241, 0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      .badge {
        animation: none;
        opacity: 1;
      }
      .card {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">DevOps Bootcamp 2026</span>
    <h1 class="name">Adam Azwan</h1>
    <p class="role">DevOps Engineer</p>
    <p class="cohort">Cohort 2026</p>
  </main>
</body>
</html>
